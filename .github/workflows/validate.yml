name: Icode course acceptance
on:
  push:
    branches: [feat/icode-workshop-host]
  pull_request:
permissions:
  contents: read
jobs:
  course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: course
      - uses: actions/checkout@v4
        with:
          repository: IcodeNet/mcp-fundamentals
          ref: 9a5336cc825ae7f502bad57dcd3c89eb362bfe9b
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@10.0.0 --activate
      - name: Install original course without changing lessons or tests
        run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: baseline
      - name: Establish original assessment outcomes
        run: node course/icode/baseline.mjs baseline course/acceptance-results/baseline.json "$(realpath $(which npm))"
      - name: Set up pinned Icode engine and course
        run: npm run setup
        working-directory: course
      - name: Verify original source and tests are unchanged
        run: git diff --exit-code 9a5336cc825ae7f502bad57dcd3c89eb362bfe9b -- 'exercises/**/*.ts' 'exercises/**/*.mdx'
        working-directory: course
      - name: Run all original assessments through Icode
        run: npm test
        working-directory: course
      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: course
      - name: Browser and Inspector acceptance
        run: node icode/browser.mjs
        working-directory: course
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-acceptance
          path: course/acceptance-results/
